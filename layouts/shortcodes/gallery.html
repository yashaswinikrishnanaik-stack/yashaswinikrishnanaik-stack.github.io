<div class="art-gallery">
{{ range readDir "static/images/art" }}
  {{ if not .IsDir }}
  <a href="/images/art/{{ .Name }}" target="_blank">
    <img src="/images/art/{{ .Name }}" alt="{{ .Name }}" loading="lazy">
  </a>
  {{ end }}
{{ end }}
</div>
<style>
.art-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
.art-gallery img { width: 100%; height: 320px; object-fit: cover; border-radius: 12px; transition: transform .2s; }
.art-gallery img:hover { transform: scale(1.03); }
</style>
