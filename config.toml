# Hugo Site Configuration
baseURL = "https://yashaswinikrishnanaik-stack.github.io/"
locale = "en-us"
title = "Yeshaswini Krishna"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    contentDir = "content/en"
    label = "English"
    weight = 1
    [languages.en.params]
      tagline = "BS-MS student at IISER Tirupati. Planetary dynamics and N-body simulations."
      hero_description = "I'm a BS-MS student at IISER Tirupati working on planetary dynamics and planet formation, mainly through N-body simulations. I'm doing my master's thesis as a visiting student at the Institute of Science Tokyo."
      hero_location = "Tokyo, Japan"
      resume_url = "/files/CV.pdf"
      collab_tags = [
        "Planetary dynamics",
        "Planet formation",
        "N-body simulations",
        "REBOUND",
        "Scientific computing"
      ]

[build]
  writeStats = true

[params]
name = "Yeshaswini Krishna"
firstName = "Yeshaswini"
lastName = "Krishna"
email = "yashaswinikrishnan@gmail.com"
profile_image = "/images/profile.jpg"
author = "Yeshaswini Krishna"

description = "BS-MS student at IISER Tirupati working on planetary dynamics, planet formation and N-body simulations."

linkedin_url = "https://www.linkedin.com/in/yashaswini-k-9b53b0275"
linkedin_text = "linkedin.com/in/yashaswini-k-9b53b0275"
github_url = "https://github.com/yashaswinikrishnanaik-stack"
github_text = "github.com/yashaswinikrishnanaik-stack"

copyright = "Yeshaswini Krishna"

resume_url_en = "/files/CV.pdf"
resume_label = "View CV"

formspreeendpoint = ""
pexelsapikey = ""

[[params.social]]
icon = "linkedin-in"
url = "https://www.linkedin.com/in/yashaswini-k-9b53b0275/"

[[params.social]]
icon = "github"
url = "https://github.com/yashaswinikrishnanaik-stack"

sectionPagesMenu = 'main'


[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

